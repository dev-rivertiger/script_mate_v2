<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배역 선택 - SCAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Caveat', cursive, -apple-system, sans-serif;
            padding: 20px;
            background: #f2ede3;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 32px;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(160,170,180,0.18) 39px, rgba(160,170,180,0.18) 40px);
            pointer-events: none;
        }
        .card {
            position: relative;
            z-index: 1;
            background: #fffef8;
            padding: 28px;
            border: 2.5px solid #2a2a2a;
            border-radius: 3px;
            box-shadow: 5px 5px 0 #2a2a2a;
            width: 100%;
            max-width: 500px;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -12px; left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 58px; height: 20px;
            background: rgba(255,230,70,0.6);
            border: 1.5px solid rgba(180,150,0,0.25);
            border-radius: 2px;
        }
        h2 {
            font-family: 'Caveat', cursive;
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 4px;
            transform: rotate(-1deg);
            display: block;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 15px;
            margin-bottom: 22px;
            display: block;
            font-family: 'Caveat', cursive;
        }

        /* TTS 토글 */
        .tts-toggle {
            background: #f8f5ee;
            padding: 14px 16px;
            border-radius: 3px;
            border: 2px solid #ccc;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tts-toggle input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: #2a2a2a; }
        .tts-toggle label { font-size: 18px; font-weight: 600; cursor: pointer; flex: 1; font-family: 'Caveat', cursive; }

        .tts-settings { display: none; margin-bottom: 18px; }
        .tts-settings.show { display: block; }
        .tts-setting-box {
            background: #fefae8;
            padding: 14px 16px;
            border-radius: 3px;
            border: 2px solid #d4c060;
            margin-bottom: 10px;
        }
        .tts-setting-label {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Caveat', cursive;
        }
        .tts-speed-value { color: #1a1a1a; font-weight: 700; }
        .tts-speed-slider {
            width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
            background: #ddd; border-radius: 3px; outline: none;
        }
        .tts-speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            background: #2a2a2a; border-radius: 50%; cursor: pointer;
        }
        .tts-range-labels { display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-top: 4px; font-family: 'Caveat', cursive; }
        .voice-info { font-size: 14px; color: #666; padding: 8px 0 0; font-family: 'Caveat', cursive; }
        .voice-info span { font-weight: 700; color: #2a2a2a; }

        /* 배역 목록 */
        .role-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; padding-right: 6px; }
        .role-option {
            margin: 10px 0; padding: 14px 16px;
            background: #f8f5ee;
            border: 2px solid #ccc;
            border-radius: 3px;
            display: flex; align-items: center;
            transition: all 0.15s;
            gap: 12px;
            cursor: pointer;
        }
        .role-option:hover { background: #f0ece0; border-color: #999; }
        .role-option:has(input:checked) { background: #fff9c2; border-color: #2a2a2a; box-shadow: 2px 2px 0 #2a2a2a; }
        input[type="radio"] { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; accent-color: #2a2a2a; }
        .role-name { font-size: 18px; font-weight: 600; flex: 1; cursor: pointer; font-family: 'Caveat', cursive; }
        .role-controls { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

        .color-preview {
            width: 28px; height: 28px; border-radius: 50%;
            border: 2px solid #999;
            cursor: pointer; transition: all 0.2s;
        }
        .color-preview:hover { transform: scale(1.15); border-color: #2a2a2a; }

        .control-btn {
            padding: 5px 11px;
            border: 2px solid #ccc;
            background: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
            font-weight: 600;
            font-family: 'Caveat', cursive;
        }
        .control-btn:hover { border-color: #2a2a2a; }
        .control-btn.active { background: #2a2a2a; color: white; border-color: #2a2a2a; }
        .gender-btn { display: none; }

        /* 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content {
            background: #fffef8; padding: 24px;
            border: 2.5px solid #2a2a2a;
            border-radius: 3px;
            box-shadow: 5px 5px 0 #2a2a2a;
            max-width: 360px; width: 90%;
        }
        .modal-header {
            font-family: 'Caveat', cursive;
            font-size: 20px; font-weight: 700;
            margin-bottom: 18px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-close {
            background: none; border: none; font-size: 26px; cursor: pointer;
            color: #666; padding: 0; width: 30px; height: 30px; line-height: 1;
        }
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .color-option-modal {
            width: 100%; aspect-ratio: 1; border-radius: 3px;
            border: 2.5px solid #ccc; cursor: pointer;
            transition: all 0.15s; position: relative;
        }
        .color-option-modal:hover { transform: scale(1.05); border-color: #555; }
        .color-option-modal.selected { border-color: #2a2a2a; border-width: 3px; box-shadow: 2px 2px 0 #2a2a2a; }
        .color-option-modal.selected::after {
            content: '✓'; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%,-50%); color: #333; font-weight: 700; font-size: 22px;
            font-family: 'Caveat', cursive;
        }

        button[type="submit"] {
            background: #2a2a2a; color: #fff9c2;
            padding: 16px; border: none;
            border-radius: 3px; cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 20px;
            width: 100%; font-weight: 700;
            transition: all 0.12s;
            box-shadow: 4px 4px 0 #555;
        }
        button[type="submit"]:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 #555; }
        button[type="submit"]:active { transform: translate(4px,4px); box-shadow: 0 0 0 #555; }

        @media (max-width: 600px) {
            body { padding: 16px; padding-top: 24px; }
            .card { padding: 22px 18px; }
            h2 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🐱 배역 선택</h2>
        <span class="subtitle">연습할 배역을 골라보세요</span>

        <div class="tts-toggle">
            <input type="checkbox" id="ttsToggle" onchange="toggleTTS()">
            <label for="ttsToggle">🔊 음성 지원 (Edge TTS)</label>
        </div>

        <div class="tts-settings" id="ttsSettings">
            <div class="tts-setting-box">
                <div class="tts-setting-label">
                    🎤 음성 속도
                    <span class="tts-speed-value" id="ttsSpeedDisplay">1.2x</span>
                </div>
                <input type="range" class="tts-speed-slider" id="ttsSpeedSlider"
                       min="0.5" max="2.0" step="0.1" value="1.2"
                       oninput="updateTTSSpeed(this.value)">
                <div class="tts-range-labels">
                    <span>느리게 0.5x</span>
                    <span>빠르게 2.0x</span>
                </div>
                <div class="voice-info">
                    여성: <span>SunHi</span> · 남성: <span>InJoon</span> — 배역별 성별 선택 가능
                </div>
            </div>
        </div>

        <form action="/practice" method="post" id="roleForm">
            <input type="hidden" name="filename" value="{{ filename }}">
            <input type="hidden" name="mode" id="modeInput" value="practice">
            <input type="hidden" name="colors" id="colorsInput" value="">
            <input type="hidden" name="genders" id="gendersInput" value="">
            <input type="hidden" name="tts_enabled" id="ttsEnabledInput" value="false">
            <input type="hidden" name="tts_speed" id="ttsSpeedInput" value="1.2">

            <div class="role-list" id="roleList">
                {% for role in roles %}
                    <div class="role-option">
                        <input type="radio" name="role" value="{{ role }}" required>
                        <span class="role-name" onclick="this.previousElementSibling.click()">{{ role }}</span>
                        <div class="role-controls">
                            <button type="button" class="control-btn gender-btn" data-role="{{ role }}" data-gender="female" onclick="selectGender(event, '{{ role }}', 'female')">여성</button>
                            <button type="button" class="control-btn gender-btn" data-role="{{ role }}" data-gender="male" onclick="selectGender(event, '{{ role }}', 'male')">남성</button>
                            <div class="color-preview" data-role="{{ role }}"
                                 style="background: #ffffff;"
                                 onclick="openColorModal(event, '{{ role }}', this)" title="색상 선택"></div>
                        </div>
                    </div>
                {% endfor %}
            </div>

            <button type="submit">연습 시작하기 →</button>
        </form>
    </div>

    <!-- 색상 모달 -->
    <div class="modal-overlay" id="colorModal" onclick="closeColorModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span id="modalRoleName">배역</span>의 색상
                <button class="modal-close" onclick="closeColorModal(event)">×</button>
            </div>
            <div class="color-grid">
                <div class="color-option-modal" style="background:#ffffff;" data-color="#ffffff" onclick="selectColor('#ffffff')"></div>
                <div class="color-option-modal" style="background:#fff9c2;" data-color="#fff9c2" onclick="selectColor('#fff9c2')"></div>
                <div class="color-option-modal" style="background:#d6f0d8;" data-color="#d6f0d8" onclick="selectColor('#d6f0d8')"></div>
                <div class="color-option-modal" style="background:#d4e8ff;" data-color="#d4e8ff" onclick="selectColor('#d4e8ff')"></div>
                <div class="color-option-modal" style="background:#ffdce0;" data-color="#ffdce0" onclick="selectColor('#ffdce0')"></div>
                <div class="color-option-modal" style="background:#fce4c8;" data-color="#fce4c8" onclick="selectColor('#fce4c8')"></div>
                <div class="color-option-modal" style="background:#e8d4f0;" data-color="#e8d4f0" onclick="selectColor('#e8d4f0')"></div>
                <div class="color-option-modal" style="background:#d4f0ec;" data-color="#d4f0ec" onclick="selectColor('#d4f0ec')"></div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('modeInput').value = urlParams.get('mode') || 'practice';

        const roleColors = {};
        const roleGenders = {};
        let currentModalRole = null;
        let currentModalPreview = null;

        {% for role in roles %}
            roleColors['{{ role }}'] = '#ffffff';
            roleGenders['{{ role }}'] = 'female';
        {% endfor %}

        function toggleTTS() {
            const enabled = document.getElementById('ttsToggle').checked;
            document.getElementById('ttsEnabledInput').value = enabled;
            document.getElementById('ttsSettings').classList.toggle('show', enabled);
            document.querySelectorAll('.gender-btn').forEach(btn => {
                btn.style.display = enabled ? 'inline-block' : 'none';
            });
            if (enabled) {
                document.querySelectorAll('.gender-btn[data-gender="female"]').forEach(btn => btn.classList.add('active'));
            }
        }

        function updateTTSSpeed(value) {
            document.getElementById('ttsSpeedDisplay').textContent = parseFloat(value).toFixed(1) + 'x';
            document.getElementById('ttsSpeedInput').value = value;
        }

        function selectGender(event, role, gender) {
            event.preventDefault(); event.stopPropagation();
            document.querySelectorAll(`.gender-btn[data-role="${role}"]`).forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            roleGenders[role] = gender;
            document.getElementById('gendersInput').value = JSON.stringify(roleGenders);
        }

        function openColorModal(event, role, previewEl) {
            event.preventDefault(); event.stopPropagation();
            currentModalRole = role;
            currentModalPreview = previewEl;
            document.getElementById('modalRoleName').textContent = role;
            const cur = roleColors[role] || '#ffffff';
            document.querySelectorAll('.color-option-modal').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.color === cur);
            });
            document.getElementById('colorModal').classList.add('show');
        }

        function closeColorModal(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            document.getElementById('colorModal').classList.remove('show');
        }

        function selectColor(color) {
            if (!currentModalRole) return;
            document.querySelectorAll('.color-option-modal').forEach(o => o.classList.remove('selected'));
            document.querySelector(`.color-option-modal[data-color="${color}"]`).classList.add('selected');
            roleColors[currentModalRole] = color;
            document.getElementById('colorsInput').value = JSON.stringify(roleColors);
            document.querySelectorAll(`.color-preview[data-role="${currentModalRole}"]`).forEach(el => {
                el.style.background = color;
                el.style.borderColor = color === '#ffffff' ? '#ccc' : color;
            });
            setTimeout(() => closeColorModal(null), 300);
        }

        document.getElementById('colorsInput').value = JSON.stringify(roleColors);
        document.getElementById('gendersInput').value = JSON.stringify(roleGenders);
        toggleTTS();
    </script>
</body>
</html>
