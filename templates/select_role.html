<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배역 선택 — Script Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#fff8f3;--card:#fff;--pop:#ff6b6b;--pop2:#ff8787;--pop-bg:#fff0f0;
            --mint:#20c997;--mint-bg:#e6fcf5;--lemon:#ffd43b;--lemon-bg:#fff9db;
            --text:#2b2b2b;--text-mid:#777;--text-light:#aaa;--border:#f0e9e3;
        }
        body{font-family:'Noto Sans KR',sans-serif;padding:20px;
            background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .card{background:var(--card);padding:32px;border-radius:24px;
            box-shadow:0 8px 32px rgba(255,107,107,.06),0 2px 8px rgba(0,0,0,.04);
            width:100%;max-width:480px;border:2px solid var(--border);}
        h2{font-family:'Jua',sans-serif;text-align:center;margin-bottom:4px;
            font-size:24px;color:var(--pop);}
        .sub{text-align:center;color:var(--text-mid);font-size:13px;margin-bottom:24px;}

        .tts-bar{background:var(--lemon-bg);padding:14px 16px;border-radius:14px;
            margin-bottom:14px;display:flex;align-items:center;gap:12px;
            border:2px solid #ffe69a;cursor:pointer;transition:all .15s;}
        .tts-bar:hover{border-color:var(--lemon);}
        .tts-bar input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--pop);}
        .tts-bar label{font-size:14px;font-weight:700;cursor:pointer;flex:1;color:var(--text);}

        .tts-opts{display:none;margin-bottom:16px;}
        .tts-opts.show{display:block;}
        .tts-box{background:var(--bg);padding:14px 16px;border-radius:14px;
            margin-bottom:10px;border:2px solid var(--border);}
        .tts-lbl{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;
            display:flex;justify-content:space-between;align-items:center;}
        .tts-v{color:var(--pop);font-weight:800;}
        .tts-sl{width:100%;height:6px;-webkit-appearance:none;appearance:none;
            background:var(--border);border-radius:3px;outline:none;}
        .tts-sl::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
            background:var(--pop);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(255,107,107,.3);}
        .tts-rng{display:flex;justify-content:space-between;font-size:11px;color:var(--text-light);margin-top:4px;}
        .voice-info{font-size:12px;color:var(--text-mid);padding:8px 0 0;}
        .voice-info span{font-weight:700;color:var(--pop);}

        .roles{max-height:340px;overflow-y:auto;margin-bottom:20px;padding-right:4px;}
        .roles::-webkit-scrollbar{width:4px}
        .roles::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .role-row{margin:8px 0;padding:14px;background:var(--bg);border-radius:16px;
            display:flex;align-items:center;gap:12px;transition:all .15s;
            border:2px solid transparent;cursor:pointer;}
        .role-row:hover{background:#fff0ed;}
        .role-row:has(input:checked){background:var(--pop-bg);border-color:var(--pop);}
        .role-row input[type="radio"]{width:17px;height:17px;cursor:pointer;accent-color:var(--pop);flex-shrink:0;}
        .rn{font-size:15px;font-weight:600;flex:1;cursor:pointer;color:var(--text);}
        .rc{display:flex;gap:6px;flex-shrink:0;align-items:center;}

        .cpv{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);
            cursor:pointer;transition:all .15s;flex-shrink:0;}
        .cpv:hover{transform:scale(1.15);border-color:var(--pop);}

        .gb{padding:5px 10px;border:2px solid var(--border);background:var(--card);
            border-radius:10px;cursor:pointer;font-size:12px;transition:all .12s;font-weight:700;
            font-family:inherit;color:var(--text-mid);display:none;}
        .gb:hover{border-color:var(--pop);color:var(--pop);}
        .gb.active{background:var(--pop);color:#fff;border-color:var(--pop);}

        .modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);
            display:none;align-items:center;justify-content:center;z-index:1000;}
        .modal-bg.show{display:flex;}
        .modal{background:var(--card);padding:24px;border-radius:22px;
            max-width:360px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.15);}
        .modal-h{font-size:16px;font-weight:700;margin-bottom:18px;color:var(--text);
            display:flex;justify-content:space-between;align-items:center;}
        .modal-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);padding:0;}
        .cg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
        .co{width:100%;aspect-ratio:1;border-radius:14px;border:3px solid transparent;
            cursor:pointer;transition:all .12s;position:relative;}
        .co:hover{transform:scale(1.06);border-color:#ccc;}
        .co.sel{border-color:var(--pop);border-width:4px;}
        .co.sel::after{content:'✓';position:absolute;top:50%;left:50%;
            transform:translate(-50%,-50%);color:var(--text);font-weight:bold;font-size:18px;}

        .go{background:var(--pop);color:#fff;padding:16px;border:none;
            border-radius:16px;cursor:pointer;font-size:16px;width:100%;font-weight:800;
            transition:all .15s;font-family:inherit;box-shadow:0 4px 16px rgba(255,107,107,.2);}
        .go:hover{background:var(--pop2);}
        .go:active{transform:scale(.98);}
        @media(max-width:480px){body{padding:16px}.card{padding:24px 20px}h2{font-size:22px}}
    </style>
</head>
<body>
<div class="card">
    <h2>💬 배역 선택</h2>
    <p class="sub">내 배역을 고르고 설정을 맞춰보세요 ✨</p>

    <div class="tts-bar" onclick="document.getElementById('ttsChk').click()">
        <input type="checkbox" id="ttsChk" onchange="toggleTTS()" onclick="event.stopPropagation()">
        <label for="ttsChk" onclick="event.stopPropagation()">🔊 음성 지원 (Edge TTS)</label>
    </div>
    <div class="tts-opts" id="ttsOpts">
        <div class="tts-box">
            <div class="tts-lbl">음성 속도 <span class="tts-v" id="spdD">1.2x</span></div>
            <input type="range" class="tts-sl" id="spdSl" min="0.5" max="2.0" step="0.1" value="1.2" oninput="updSpd(this.value)">
            <div class="tts-rng"><span>느리게 0.5x</span><span>빠르게 2.0x</span></div>
            <div class="voice-info">여성: <span>SunHi</span> · 남성: <span>InJoon</span></div>
        </div>
    </div>

    <form action="/practice" method="post">
        <input type="hidden" name="filename" value="{{ filename }}">
        <input type="hidden" name="mode" id="modeIn" value="practice">
        <input type="hidden" name="colors" id="colIn" value="">
        <input type="hidden" name="genders" id="genIn" value="">
        <input type="hidden" name="tts_enabled" id="ttsEnIn" value="false">
        <input type="hidden" name="tts_speed" id="ttsSpdIn" value="1.2">
        <div class="roles">
            {% for role in roles %}
            <div class="role-row" onclick="this.querySelector('input').click()">
                <input type="radio" name="role" value="{{ role }}" required onclick="event.stopPropagation()">
                <span class="rn" onclick="event.stopPropagation();this.previousElementSibling.click()">{{ role }}</span>
                <div class="rc" onclick="event.stopPropagation()">
                    <button type="button" class="gb" data-role="{{ role }}" data-gender="female" onclick="selG(event,'{{ role }}','female')">여</button>
                    <button type="button" class="gb" data-role="{{ role }}" data-gender="male" onclick="selG(event,'{{ role }}','male')">남</button>
                    <div class="cpv" data-role="{{ role }}" style="background:#fff" onclick="openCM(event,'{{ role }}',this)"></div>
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="go">시작하기 →</button>
    </form>
</div>

<div class="modal-bg" id="cM" onclick="closeCM(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-h"><span id="mR">배역</span> 색상<button class="modal-x" onclick="closeCM(event)">×</button></div>
        <div class="cg">
            <div class="co" style="background:#fff" data-color="#fff" onclick="pickC('#fff')"></div>
            <div class="co" style="background:#ffe0e0" data-color="#ffe0e0" onclick="pickC('#ffe0e0')"></div>
            <div class="co" style="background:#fff3d6" data-color="#fff3d6" onclick="pickC('#fff3d6')"></div>
            <div class="co" style="background:#d6f0ff" data-color="#d6f0ff" onclick="pickC('#d6f0ff')"></div>
            <div class="co" style="background:#e0dff8" data-color="#e0dff8" onclick="pickC('#e0dff8')"></div>
            <div class="co" style="background:#d6f5e0" data-color="#d6f5e0" onclick="pickC('#d6f5e0')"></div>
            <div class="co" style="background:#ffd6ec" data-color="#ffd6ec" onclick="pickC('#ffd6ec')"></div>
            <div class="co" style="background:#f0ebe0" data-color="#f0ebe0" onclick="pickC('#f0ebe0')"></div>
        </div>
    </div>
</div>

<script>
const uP=new URLSearchParams(location.search);
document.getElementById('modeIn').value=uP.get('mode')||'practice';
const rC={},rG={};let curR=null,curP=null;
{% for role in roles %}rC['{{role}}']='#fff';rG['{{role}}']='female';{% endfor %}
function toggleTTS(){
    const en=document.getElementById('ttsChk').checked;
    document.getElementById('ttsEnIn').value=en;
    document.getElementById('ttsOpts').classList.toggle('show',en);
    document.querySelectorAll('.gb').forEach(b=>b.style.display=en?'inline-block':'none');
    if(en)document.querySelectorAll('.gb[data-gender="female"]').forEach(b=>b.classList.add('active'));
}
function updSpd(v){document.getElementById('spdD').textContent=parseFloat(v).toFixed(1)+'x';document.getElementById('ttsSpdIn').value=v;}
function selG(e,role,g){
    e.preventDefault();e.stopPropagation();
    document.querySelectorAll(`.gb[data-role="${role}"]`).forEach(b=>b.classList.remove('active'));
    e.currentTarget.classList.add('active');rG[role]=g;
    document.getElementById('genIn').value=JSON.stringify(rG);
}
function openCM(e,role,el){
    e.preventDefault();e.stopPropagation();curR=role;curP=el;
    document.getElementById('mR').textContent=role;
    const cur=rC[role]||'#fff';
    document.querySelectorAll('.co').forEach(o=>o.classList.toggle('sel',o.dataset.color===cur));
    document.getElementById('cM').classList.add('show');
}
function closeCM(e){if(e){e.preventDefault();e.stopPropagation();}document.getElementById('cM').classList.remove('show');}
function pickC(c){
    if(!curR)return;document.querySelectorAll('.co').forEach(o=>o.classList.remove('sel'));
    document.querySelector(`.co[data-color="${c}"]`).classList.add('sel');
    rC[curR]=c;document.getElementById('colIn').value=JSON.stringify(rC);
    document.querySelectorAll(`.cpv[data-role="${curR}"]`).forEach(el=>{
        el.style.background=c;el.style.borderColor=c==='#fff'?'var(--border)':c;});
    setTimeout(()=>closeCM(null),200);
}
document.getElementById('colIn').value=JSON.stringify(rC);
document.getElementById('genIn').value=JSON.stringify(rG);
toggleTTS();
</script>
</body>
</html>
