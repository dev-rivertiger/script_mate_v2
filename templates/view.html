<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전체 읽기 — Script Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --fs:17px;--bg:#fff8f3;--card:#fff;--pop:#ff6b6b;--pop2:#ff8787;--pop-bg:#fff0f0;
            --mint:#20c997;--mint-bg:#e6fcf5;--lemon:#ffd43b;--lemon-bg:#fff9db;
            --text:#2b2b2b;--text-mid:#777;--text-light:#aaa;--border:#f0e9e3;
        }
        body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);
            display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;position:fixed;width:100%;}

        .top{background:var(--card);padding:10px 14px;border-bottom:2px solid var(--border);
            display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:100;}
        .tb{background:var(--bg);border:2px solid var(--border);color:var(--text-mid);
            width:38px;height:38px;border-radius:12px;cursor:pointer;font-size:17px;
            display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0;}
        .tb:active{background:var(--pop-bg);border-color:var(--pop);color:var(--pop);}
        .fname{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;flex:1;
            text-align:center;color:var(--pop);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

        /* 설정 패널 */
        .ov{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:199;display:none;}
        .ov.show{display:block;}
        .sp{position:fixed;top:0;right:-100%;width:290px;height:100%;background:var(--card);
            box-shadow:-6px 0 30px rgba(0,0,0,.08);z-index:200;transition:right .3s ease;overflow-y:auto;}
        .sp.open{right:0;}
        .sp-h{padding:18px 20px;background:var(--lemon-bg);border-bottom:2px solid #ffe69a;
            display:flex;justify-content:space-between;align-items:center;}
        .sp-h h3{font-family:'Jua',sans-serif;font-size:17px;color:var(--text);}
        .sp-x{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-light);}
        .sp-b{padding:20px;}
        .si{margin-bottom:22px;}
        .sl{font-size:13px;font-weight:700;margin-bottom:8px;display:block;color:var(--text);}
        .sv{font-size:17px;font-weight:800;color:var(--pop);margin-bottom:6px;display:block;}

        .tw{display:flex;align-items:center;gap:10px;padding:4px 0;}
        .tsw{position:relative;width:48px;height:26px;flex-shrink:0;}
        .tsw input{opacity:0;width:0;height:0;}
        .tsl{position:absolute;inset:0;background:var(--border);border-radius:26px;cursor:pointer;transition:.25s;}
        .tsl::before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;
            background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.1);}
        .tsw input:checked+.tsl{background:var(--pop);}
        .tsw input:checked+.tsl::before{transform:translateX(22px);}
        .tlb{font-size:13px;font-weight:700;color:var(--text);}

        .sw{margin-top:10px}.sw.hid{display:none}
        .ss{width:100%;height:5px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:3px;outline:none;}
        .ss::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--pop);border-radius:50%;cursor:pointer;
            box-shadow:0 2px 6px rgba(255,107,107,.3);}
        .sr{display:flex;justify-content:space-between;font-size:10px;color:var(--text-light);margin-top:3px;}

        .rw{margin-top:14px}.rw.hid{display:none}
        .ro{display:flex;gap:6px;margin-top:6px;}
        .roi{flex:1;padding:9px 4px;border:2px solid var(--border);background:var(--card);
            border-radius:12px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;
            transition:all .12s;font-family:inherit;color:var(--text-mid);}
        .roi.act{border-color:var(--pop);background:var(--pop-bg);color:var(--pop);}
        .rcw{margin-top:8px;display:flex;align-items:center;gap:6px;}.rcw.hid{display:none}
        .rci{width:52px;padding:7px;border:2px solid var(--border);border-radius:12px;
            font-size:16px;font-weight:800;text-align:center;outline:none;font-family:inherit;color:var(--text);}
        .rci:focus{border-color:var(--pop);}
        .rst{font-size:11px;color:var(--text-light);margin-top:6px;padding:5px 8px;
            background:var(--bg);border-radius:8px;}

        .sb{display:flex;gap:6px;margin-top:6px;}
        .s-btn{flex:1;padding:10px;background:var(--bg);border:2px solid var(--border);
            border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
            font-family:inherit;color:var(--text);transition:all .1s;}
        .s-btn:active{background:var(--border);}
        .s-rst{width:100%;margin-top:16px;padding:10px;background:var(--lemon-bg);
            border:2px solid #ffe69a;border-radius:12px;font-size:13px;font-weight:700;
            cursor:pointer;font-family:inherit;color:#d4a017;}

        /* 채팅 */
        #chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 12px;
            display:flex;flex-direction:column;gap:9px;-webkit-overflow-scrolling:touch;}
        #chat::-webkit-scrollbar{width:4px}
        #chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

        .msg{max-width:84%;padding:12px 16px;border-radius:18px;line-height:1.7;
            font-size:var(--fs);word-wrap:break-word;box-shadow:0 2px 8px rgba(0,0,0,.04);}
        .msg.an{animation:pop .3s cubic-bezier(.34,1.56,.64,1) forwards;}
        .msg:not(.an){opacity:1;}
        @keyframes pop{from{opacity:0;transform:scale(.92) translateY(8px)}to{opacity:1;transform:none}}
        .bot{align-self:flex-start;background:var(--card);border:2px solid var(--border);border-bottom-left-radius:4px;}
        .user{align-self:flex-end;background:var(--lemon-bg);border:2px solid #ffe69a;border-bottom-right-radius:4px;}
        .action{align-self:center;background:var(--mint-bg);font-size:calc(var(--fs)*.88);
            border-radius:20px;padding:6px 16px;max-width:90%;text-align:center;
            color:var(--mint);border:1.5px solid #b2f2d9;font-style:italic;}
        .rl{font-size:calc(var(--fs)*.72);font-weight:700;margin-bottom:4px;display:block;color:var(--pop);}
        .msg.speaking{box-shadow:0 0 0 3px var(--pop),0 4px 16px rgba(255,107,107,.15);
            animation:glow 1s ease-in-out infinite alternate;}
        @keyframes glow{from{box-shadow:0 0 0 3px var(--pop),0 4px 16px rgba(255,107,107,.15)}
            to{box-shadow:0 0 0 3px var(--pop),0 4px 24px rgba(255,107,107,.3)}}
        .rdiv{align-self:center;padding:7px 18px;margin:6px 0;
            background:linear-gradient(135deg,var(--pop),#e85d5d);
            color:#fff;border-radius:20px;font-size:13px;font-weight:700;
            box-shadow:0 3px 10px rgba(255,107,107,.2);}

        /* 맨위로 */
        .go-top{position:fixed;bottom:72px;right:16px;width:44px;height:44px;
            border-radius:50%;background:var(--card);border:2px solid var(--border);
            box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer;font-size:18px;
            display:none;align-items:center;justify-content:center;z-index:50;
            transition:all .15s;color:var(--pop);}
        .go-top.show{display:flex;}
        .go-top:active{background:var(--pop-bg);}

        /* 하단바 */
        .bb{background:var(--card);padding:10px 14px;border-top:2px solid var(--border);
            display:flex;justify-content:center;gap:10px;flex-shrink:0;}
        .bb.hid{display:none;}
        .bbb{padding:10px 22px;border:none;border-radius:14px;font-size:14px;
            font-weight:700;cursor:pointer;font-family:inherit;transition:all .1s;}
        .bbb:active{transform:scale(.96);}
        .bp{background:var(--pop);color:#fff;}
        .br{background:var(--mint);color:#fff;}
        .bs{background:var(--bg);color:var(--text);border:2px solid var(--border);}

        /* 시작 오버레이 */
        .st-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;
            display:none;align-items:center;justify-content:center;}
        .st-box{background:var(--card);padding:44px 32px;border-radius:28px;
            text-align:center;max-width:300px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,.15);}
        .st-i{font-size:52px;display:block;margin-bottom:10px;}
        .st-t{font-family:'Jua',sans-serif;font-size:22px;color:var(--pop);margin-bottom:6px;}
        .st-s{font-size:13px;color:var(--text-mid);margin-bottom:24px;}
        .st-btn{width:100%;padding:16px;border:none;border-radius:16px;
            background:var(--pop);color:#fff;font-size:18px;font-weight:800;
            cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(255,107,107,.25);}
        .st-btn:active{transform:scale(.97);}

        @supports(-webkit-touch-callout:none){body{height:-webkit-fill-available}}
    </style>
</head>
<body>

<div class="top">
    <button class="tb" onclick="goHome()">🏠</button>
    <div class="fname">📖 {{ filename }}</div>
    <button class="tb" onclick="togS()">⚙️</button>
</div>

<div class="ov" id="ov" onclick="togS()"></div>
<div class="sp" id="sp">
    <div class="sp-h"><h3>⚙️ 설정</h3><button class="sp-x" onclick="togS()">✕</button></div>
    <div class="sp-b">
        <div class="si">
            <label class="sl">🔊 음성 지원</label>
            <div class="tw">
                <label class="tsw"><input type="checkbox" id="ttsSw" onchange="togTTS()"><span class="tsl"></span></label>
                <span class="tlb" id="ttsLb">OFF</span>
            </div>
            <div class="sw hid" id="spdW">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                    <span style="font-size:12px;font-weight:600">음성 속도</span>
                    <span style="font-size:14px;font-weight:800;color:var(--pop)" id="spdV">1.2x</span>
                </div>
                <input type="range" class="ss" id="spdSl" min="0.5" max="2.0" step="0.1" value="1.2" oninput="uSpd(this.value)">
                <div class="sr"><span>0.5x</span><span>2.0x</span></div>
            </div>
            <div class="rw hid" id="rW">
                <label class="sl" style="margin-top:10px">🔁 반복</label>
                <div class="ro">
                    <div class="roi act" id="r1" onclick="setR('once')">1회</div>
                    <div class="roi" id="rN" onclick="setR('count')">횟수</div>
                    <div class="roi" id="rI" onclick="setR('infinite')">∞ 무한</div>
                </div>
                <div class="rcw hid" id="rcW">
                    <span style="font-size:12px">반복</span>
                    <input type="number" class="rci" id="rcIn" value="3" min="2" max="99" onchange="uRC()">
                    <span style="font-size:12px">회</span>
                </div>
                <div class="rst" id="rSt">1회 재생</div>
            </div>
        </div>
        <div class="si">
            <label class="sl">📐 폰트 크기</label>
            <span class="sv" id="fV">17px</span>
            <div class="sb">
                <button class="s-btn" onclick="chgF(-1);event.stopPropagation()">A−</button>
                <button class="s-btn" onclick="chgF(1);event.stopPropagation()">A+</button>
            </div>
        </div>
        <button class="s-rst" onclick="rstAll();event.stopPropagation()">🔄 기본값으로</button>
    </div>
</div>

<div class="st-ov" id="stOv">
    <div class="st-box">
        <span class="st-i">💬</span>
        <div class="st-t">음성 읽기 시작!</div>
        <div class="st-s">버튼을 눌러 재생해주세요 🎤</div>
        <button class="st-btn" id="stBtn">▶ 시작</button>
    </div>
</div>

<button class="go-top" id="goTop" onclick="chat.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div id="chat"></div>

<div class="bb hid" id="bbar">
    <button class="bbb bp" id="pBtn" onclick="togP()">⏸ 일시정지</button>
    <button class="bbb bs" onclick="goHome()">⏹ 중지</button>
</div>

<script>
const SD=JSON.parse('{{ script | tojson | safe }}');
const MR=JSON.parse('{{ my_roles | tojson | safe }}');
let RC={};try{RC=JSON.parse('{{ colors | safe }}')}catch(e){}
let RG={};try{RG=JSON.parse('{{ genders | safe }}')}catch(e){}
let ttsOn='{{ tts_enabled }}'==='true';
let ttsSpd=parseFloat('{{ tts_speed }}')||1.2;
let fs=17,dly=350,paused=false,stopped=false,running=false;
let rM='once',rT=3,cR=1;
const chat=document.getElementById('chat');
const SA=new Audio();

function strip(t){return t?t.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim():'';}

function loadS(){
    const sf=localStorage.getItem('smF3');if(sf)fs=parseInt(sf);
    document.documentElement.style.setProperty('--fs',fs+'px');
    document.getElementById('fV').textContent=fs+'px';
    document.getElementById('ttsSw').checked=ttsOn;uTUI();
    document.getElementById('spdSl').value=ttsSpd;
    document.getElementById('spdV').textContent=ttsSpd.toFixed(1)+'x';
}
function togS(){document.getElementById('sp').classList.toggle('open');document.getElementById('ov').classList.toggle('show');}
function chgF(d){fs+=d;fs=Math.max(12,Math.min(24,fs));
    document.documentElement.style.setProperty('--fs',fs+'px');localStorage.setItem('smF3',fs);
    document.getElementById('fV').textContent=fs+'px';fl('fV');}
function rstAll(){fs=17;document.documentElement.style.setProperty('--fs','17px');
    localStorage.setItem('smF3','17');document.getElementById('fV').textContent='17px';fl('fV');}
function fl(id){const e=document.getElementById(id);e.style.color='var(--mint)';setTimeout(()=>e.style.color='var(--pop)',300);}

function togTTS(){
    ttsOn=document.getElementById('ttsSw').checked;uTUI();
    if(!ttsOn){SA.pause();renderStatic();}
    else{chat.innerHTML='';document.getElementById('bbar').classList.remove('hid');startTTS();}
}
function uTUI(){
    document.getElementById('ttsLb').textContent=ttsOn?'ON':'OFF';
    document.getElementById('spdW').classList.toggle('hid',!ttsOn);
    document.getElementById('rW').classList.toggle('hid',!ttsOn);
    document.getElementById('bbar').classList.toggle('hid',!ttsOn);
}
function uSpd(v){ttsSpd=parseFloat(v);document.getElementById('spdV').textContent=ttsSpd.toFixed(1)+'x';}

function unlock(){
    SA.src='data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRBqSAAAAAAAAAAAAAAAAAAAA//tQZAAP8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tQZB8P8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==';
    SA.play().then(()=>{SA.pause();SA.currentTime=0;}).catch(()=>{});
}
function speak(text,role){
    return new Promise(res=>{
        if(!ttsOn||!text?.trim()){res();return;}
        const c=strip(text);if(!c){res();return;}
        SA.pause();
        SA.onended=()=>{SA.onended=null;SA.onerror=null;res();};
        SA.onerror=()=>{SA.onended=null;SA.onerror=null;res();};
        SA.src=`/tts?text=${encodeURIComponent(c)}&gender=${RG[role]||'female'}&speed=${ttsSpd}`;
        SA.play().catch(()=>{res();});
    });
}

function setR(m){rM=m;
    document.querySelectorAll('.roi').forEach(e=>e.classList.remove('act'));
    document.getElementById(m==='once'?'r1':m==='count'?'rN':'rI').classList.add('act');
    document.getElementById('rcW').classList.toggle('hid',m!=='count');uRS();}
function uRC(){rT=parseInt(document.getElementById('rcIn').value)||3;uRS();}
function uRS(){const s=document.getElementById('rSt');
    if(rM==='once')s.textContent='1회 재생';
    else if(rM==='count')s.textContent=`${rT}회 반복 · ${cR}회차`;
    else s.textContent=`무한 반복 · ${cR}회차`;}

function addMsg(text,type,role,idx,anim=true){
    const d=document.createElement('div');
    d.className='msg '+type+(anim?' an':'');
    if(RC[role]&&type!=='action')d.style.background=RC[role];
    if(type!=='action')d.innerHTML=`<span class="rl">${role}</span>${text}`;
    else d.textContent=text;
    chat.appendChild(d);
    if(anim)chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
    return d;
}
function addRD(n){const d=document.createElement('div');d.className='rdiv';
    d.textContent=`🔁 ${n}회차`;chat.appendChild(d);chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});}

function renderStatic(){
    chat.innerHTML='';
    SD.forEach(it=>{
        const my=MR.some(r=>it.role.includes(r));
        const tp=it.role==="(지문)"?"action":my?"user":"bot";
        addMsg(it.text,tp,it.role,it.idx,false);
    });
    document.getElementById('bbar').classList.add('hid');
}

function wP(){return new Promise(r=>{if(!paused){r();return;}
    const c=setInterval(()=>{if(!paused||stopped){clearInterval(c);r();}},100);});}
function togP(){paused=!paused;const b=document.getElementById('pBtn');
    if(paused){b.textContent='▶ 재개';b.className='bbb br';SA.pause();}
    else{b.textContent='⏸ 일시정지';b.className='bbb bp';if(ttsOn&&SA.src)SA.play().catch(()=>{});}}
function goHome(){stopped=true;SA.pause();location.href='/';}

async function playOnce(){
    for(let i=0;i<SD.length;i++){
        if(stopped)return false;await wP();if(stopped)return false;
        const it=SD[i],my=MR.some(r=>it.role.includes(r));
        const tp=it.role==="(지문)"?"action":my?"user":"bot";
        const el=addMsg(it.text,tp,it.role,it.idx);
        if(ttsOn&&it.role!=="(지문)"&&it.text.trim()){
            el.classList.add('speaking');await speak(it.text,it.role);
            el.classList.remove('speaking');await new Promise(r=>setTimeout(r,100));
        }else{await new Promise(r=>setTimeout(r,dly));}
    }return true;
}
async function run(){
    if(running)return;running=true;cR=1;uRS();chat.innerHTML='';
    while(!stopped){
        if(cR>1){addRD(cR);await new Promise(r=>setTimeout(r,700));}
        const ok=await playOnce();if(!ok||stopped)break;
        if(rM==='once')break;
        else if(rM==='count'){if(cR>=rT)break;cR++;uRS();}
        else{cR++;uRS();}
    }
    if(!stopped){const e=document.createElement('div');e.className='msg action an';
        e.textContent=rM==='once'?'🎉 읽기 완료!':'🎉 '+cR+'회 반복 완료!';
        chat.appendChild(e);chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});}
    running=false;
}
function startTTS(){
    stopped=false;running=false;paused=false;
    const ov=document.getElementById('stOv');ov.style.display='flex';
    document.getElementById('stBtn').onclick=()=>{unlock();ov.style.display='none';run();};
}

const gtB=document.getElementById('goTop');
chat.addEventListener('scroll',()=>{gtB.classList.toggle('show',chat.scrollTop>300);});

loadS();
if(ttsOn)startTTS();else renderStatic();
if(performance.navigation.type===performance.navigation.TYPE_RELOAD)location.href='/';
</script>
</body>
</html>
