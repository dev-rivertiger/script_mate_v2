<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCAT - 전체 보기</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --font-size: 18px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e8e0d0;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            overflow: hidden; position: fixed; width: 100%;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(160,170,180,0.12) 39px, rgba(160,170,180,0.12) 40px);
            pointer-events: none; z-index: 0;
        }

        .top-bar {
            background: #fffef8;
            padding: 10px 14px;
            border-bottom: 2.5px solid #2a2a2a;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; gap: 8px;
            box-shadow: 0 2px 0 #2a2a2a;
        }
        .top-bar button {
            background: #2a2a2a; color: #fff9c2;
            border: none; padding: 9px 14px;
            border-radius: 3px; cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 16px; font-weight: 700;
            box-shadow: 2px 2px 0 #555;
            transition: all 0.12s;
        }
        .top-bar button:active { transform: translate(2px,2px); box-shadow: 0 0 0 #555; }
        .top-bar .filename {
            font-family: 'Caveat', cursive;
            font-weight: 700; font-size: 16px; flex: 1; text-align: center;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
            color: #2a2a2a;
        }
        .settings-btn { background: #555 !important; padding: 9px 13px !important; font-size: 17px !important; }

        /* 설정 패널 */
        .settings-panel {
            position: fixed; top: 0; right: -100%; width: 300px; height: 100%;
            background: #fffef8; box-shadow: -4px 0 0 #2a2a2a;
            z-index: 200; transition: right 0.3s ease; overflow-y: auto;
            border-left: 2.5px solid #2a2a2a;
        }
        .settings-panel.open { right: 0; }
        .s-header {
            padding: 18px 20px; background: #fff9c2;
            border-bottom: 2.5px solid #2a2a2a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .s-header h3 { font-family: 'Caveat', cursive; font-size: 20px; margin: 0; }
        .close-btn {
            background: none; border: 2px solid #2a2a2a; font-size: 20px; cursor: pointer;
            color: #2a2a2a; width: 30px; height: 30px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
        }
        .s-content { padding: 22px; }
        .s-item { margin-bottom: 22px; }
        .s-label { font-family: 'Caveat', cursive; font-size: 17px; font-weight: 700; margin-bottom: 8px; display: block; color: #2a2a2a; }
        .s-value { font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; color: #2a2a2a; margin-bottom: 8px; display: block; transition: color 0.3s; }
        .s-ctrl { display: flex; gap: 8px; }
        .s-btn {
            flex: 1; padding: 10px;
            background: #f0ece0; border: 2px solid #ccc; border-radius: 3px;
            font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .s-btn:active { background: #ddd; }

        .t-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
        .t-sw { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
        .t-sw input { opacity: 0; width: 0; height: 0; }
        .t-sl {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc; border-radius: 28px; cursor: pointer; transition: 0.3s;
            border: 2px solid #999;
        }
        .t-sl::before { content: ''; position: absolute; height: 20px; width: 20px;
            left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.3s; }
        .t-sw input:checked + .t-sl { background: #2a2a2a; border-color: #2a2a2a; }
        .t-sw input:checked + .t-sl::before { transform: translateX(24px); }

        .spd-wrap { margin-top: 12px; }
        .spd-wrap.hidden { display: none; }
        .spd-slider { width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
            background: #ddd; border-radius: 3px; outline: none; }
        .spd-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px;
            background: #2a2a2a; border-radius: 50%; cursor: pointer; }
        .spd-labels { display: flex; justify-content: space-between; font-family: 'Caveat', cursive; font-size: 12px; color: #999; margin-top: 4px; }

        .repeat-wrap { margin-top: 12px; }
        .repeat-wrap.hidden { display: none; }
        .repeat-options { display: flex; gap: 8px; margin-top: 8px; }
        .repeat-opt {
            flex: 1; padding: 10px; border: 2px solid #ccc; background: white;
            border-radius: 3px; text-align: center; cursor: pointer;
            font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; transition: all 0.15s;
        }
        .repeat-opt.active { border-color: #2a2a2a; background: #fff9c2; color: #2a2a2a; }
        .repeat-count-wrap { margin-top: 10px; display: flex; align-items: center; gap: 10px; }
        .repeat-count-wrap.hidden { display: none; }
        .repeat-count-input {
            width: 60px; padding: 8px; border: 2px solid #ccc; border-radius: 3px;
            font-family: 'Caveat', cursive; font-size: 20px; font-weight: 700; text-align: center; outline: none;
        }
        .repeat-count-input:focus { border-color: #2a2a2a; }
        .repeat-status {
            font-family: 'Caveat', cursive; font-size: 14px; color: #666;
            margin-top: 8px; padding: 6px 10px;
            background: #f8f5ee; border-radius: 3px; border: 1px solid #ddd;
        }

        .settings-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 199; display: none;
        }
        .settings-overlay.show { display: block; }

        #chat-window {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 16px; display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch;
            position: relative; z-index: 1;
        }

        /* 말풍선 */
        .msg {
            max-width: 85%; padding: 12px 15px;
            border-radius: 3px;
            line-height: 1.6;
            font-size: var(--font-size); word-wrap: break-word;
            border: 2px solid #2a2a2a;
            opacity: 0; transform: translateY(10px);
        }
        .msg.animate { animation: slideIn 0.35s ease-out forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        .bot  { align-self: flex-start; background: white; box-shadow: 3px 3px 0 #2a2a2a; border-bottom-left-radius: 0; }
        .user { align-self: flex-end; background: #fff9c2; box-shadow: -3px 3px 0 #2a2a2a; border-bottom-right-radius: 0; }
        .action {
            align-self: center;
            background: rgba(42,42,42,0.07);
            border: 1.5px dashed #999; border-radius: 20px;
            font-size: calc(var(--font-size) * 0.85);
            padding: 7px 16px; max-width: 90%; text-align: center;
            box-shadow: none;
        }

        /* ★ 넘버링 라벨 */
        .role-label {
            font-family: 'Caveat', cursive;
            font-size: calc(var(--font-size) * 0.72);
            font-weight: 700;
            margin-bottom: 5px;
            display: block;
            color: #555;
            border-bottom: 1.5px solid rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .role-label .num {
            display: inline-block;
            background: #2a2a2a;
            color: white;
            font-size: calc(var(--font-size) * 0.62);
            padding: 1px 6px;
            border-radius: 10px;
            margin-right: 4px;
            font-family: 'Caveat', cursive;
            font-weight: 700;
        }

        .msg.speaking {
            box-shadow: 0 0 0 2.5px #2a2a2a, 3px 3px 0 #2a2a2a;
        }

        /* 라운드 구분선 */
        .round-divider {
            align-self: center; padding: 7px 20px; margin: 6px 0;
            background: #2a2a2a;
            color: #fff9c2;
            border-radius: 3px;
            font-family: 'Caveat', cursive;
            font-size: 15px; font-weight: 700;
            box-shadow: 2px 2px 0 #555;
        }

        .bottom-bar {
            background: #fffef8;
            padding: 10px 16px;
            border-top: 2.5px solid #2a2a2a;
            display: flex; justify-content: center; gap: 12px; flex-shrink: 0;
            box-shadow: 0 -2px 0 #2a2a2a;
            position: relative; z-index: 1;
        }
        .bottom-bar button {
            padding: 10px 24px;
            border: 2px solid #2a2a2a;
            border-radius: 3px;
            font-family: 'Caveat', cursive;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.12s;
            box-shadow: 3px 3px 0 #2a2a2a;
        }
        .bottom-bar button:active { transform: translate(3px,3px); box-shadow: 0 0 0 #2a2a2a; }
        .b-pause  { background: #ffdce0; color: #2a2a2a; }
        .b-resume { background: #d6f0d8; color: #2a2a2a; }
        .b-stop   { background: #f0ece0; color: #2a2a2a; }

        @supports (-webkit-touch-callout: none) { body { height: -webkit-fill-available; } }

        /* 맨위로 버튼 */
        #scrollTopBtn {
            position: fixed;
            bottom: 72px; right: 16px;
            width: 44px; height: 44px;
            background: #2a2a2a; color: #fff9c2;
            border: 2px solid #2a2a2a;
            border-radius: 3px;
            font-size: 20px; font-weight: 700;
            cursor: pointer;
            box-shadow: 3px 3px 0 #555;
            z-index: 50;
            display: none;
            align-items: center; justify-content: center;
            transition: all 0.12s;
        }
        #scrollTopBtn:active { transform: translate(3px,3px); box-shadow: 0 0 0 #555; }
        #scrollTopBtn.visible { display: flex; }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="stopAndGoHome()">🏠 홈</button>
    <div class="filename">📖 {{ filename }}</div>
    <button class="settings-btn" onclick="toggleSettings()">☰</button>
</div>

<div class="settings-overlay" id="overlay" onclick="toggleSettings()"></div>

<div class="settings-panel" id="panel">
    <div class="s-header">
        <h3>⚙️ 설정</h3>
        <button class="close-btn" onclick="toggleSettings()">✕</button>
    </div>
    <div class="s-content">
        <div class="s-item">
            <label class="s-label">🔊 음성 지원</label>
            <div class="t-row">
                <label class="t-sw">
                    <input type="checkbox" id="ttsSwitch" onchange="toggleTTS()">
                    <span class="t-sl"></span>
                </label>
                <span id="ttsLabel" style="font-family:'Caveat',cursive;font-size:16px;font-weight:700;">OFF</span>
            </div>
            <div class="spd-wrap hidden" id="spdWrap">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-family:'Caveat',cursive;font-size:15px;font-weight:600;">음성 속도</span>
                    <span style="font-family:'Caveat',cursive;font-size:18px;font-weight:700;color:#2a2a2a;" id="spdVal">1.2x</span>
                </div>
                <input type="range" class="ss" id="spdSl" min="0.5" max="2.0" step="0.1" value="1.2" oninput="uSpd(this.value)">
                <div class="sr"><span>0.5x</span><span>2.0x</span></div>
            </div>
            <div class="repeat-wrap hidden" id="repeatWrap">
                <label class="s-label" style="margin-top:14px;">🔁 반복 재생</label>
                <div class="repeat-options">
                    <div class="repeat-opt active" id="repOnce" onclick="setRepeat('once')">1회</div>
                    <div class="repeat-opt" id="repCount" onclick="setRepeat('count')">횟수</div>
                    <div class="repeat-opt" id="repInf" onclick="setRepeat('infinite')">무한</div>
                </div>
                <div class="repeat-count-wrap hidden" id="repCountWrap">
                    <span style="font-family:'Caveat',cursive;font-size:15px;">반복 횟수:</span>
                    <input type="number" class="repeat-count-input" id="repCountInput" value="3" min="2" max="99" onchange="updateRepeatCount()">
                    <span style="font-family:'Caveat',cursive;font-size:15px;">회</span>
                </div>
                <div class="rst" id="rSt">1회 재생</div>
            </div>
        </div>
        <div class="s-item">
            <label class="s-label">⏱ 대사 속도</label>
            <span class="s-value" id="delayVal">0.5초</span>
            <div class="s-ctrl">
                <button class="s-btn" onclick="chgDelay(-1);event.stopPropagation()">빠르게 -</button>
                <button class="s-btn" onclick="chgDelay(1);event.stopPropagation()">느리게 +</button>
            </div>
            <div style="margin-top:6px;font-family:'Caveat',cursive;font-size:13px;color:#888;">0.2초 ~ 2.0초</div>
            <div style="margin-top:4px;font-family:'Caveat',cursive;font-size:13px;color:#999;" id="delayNote"></div>
        </div>
        <div class="s-item">
            <label class="s-label">🔤 폰트 크기</label>
            <span class="s-value" id="fontVal">18px</span>
            <div class="s-ctrl">
                <button class="s-btn" onclick="chgFont(-2);event.stopPropagation()">A−</button>
                <button class="s-btn" onclick="chgFont(2);event.stopPropagation()">A+</button>
            </div>
            <div style="margin-top:6px;font-family:'Caveat',cursive;font-size:13px;color:#888;">12px ~ 28px</div>
        </div>
        <button class="s-btn" onclick="resetAll();event.stopPropagation()" style="width:100%;background:#fff9c2;border-color:#2a2a2a;margin-top:16px;">🔄 기본값 초기화</button>
    </div>
</div>

<!-- 모바일 자동재생 잠금 해제 오버레이 -->
<div id="startOverlay" style="
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.65);z-index:300;
    display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;
">
    <div style="background:#fffef8;padding:32px;border:2.5px solid #2a2a2a;border-radius:3px;box-shadow:5px 5px 0 #2a2a2a;text-align:center;max-width:320px;width:90%;">
        <div style="font-size:48px;margin-bottom:12px;">🐱</div>
        <div style="font-family:'Caveat',cursive;font-size:24px;font-weight:700;margin-bottom:8px;">전체 읽기 시작</div>
        <div style="font-family:'Caveat',cursive;font-size:15px;color:#666;margin-bottom:24px;">버튼을 눌러 음성 재생을 시작하세요</div>
        <button id="startBtn" style="
            width:100%;padding:14px;
            border:2.5px solid #2a2a2a;border-radius:3px;
            background:#2a2a2a;color:#fff9c2;
            font-family:'Caveat',cursive;font-size:20px;font-weight:700;
            cursor:pointer;box-shadow:3px 3px 0 #555;
        ">▶ 재생 시작</button>
    </div>
</div>

<div id="chat-window"></div>

<button id="scrollTopBtn" onclick="chat.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div class="bottom-bar">
    <button class="b-pause" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
    <button class="b-stop" onclick="stopAndGoHome()">⏹ 중지</button>
</div>

<script>
    const scriptData = JSON.parse('{{ script | tojson | safe }}');
    const myRoles = JSON.parse('{{ my_roles | tojson | safe }}');
    let roleColors = {}; try { roleColors = JSON.parse('{{ colors | safe }}'); } catch(e) {}
    let roleGenders = {}; try { roleGenders = JSON.parse('{{ genders | safe }}'); } catch(e) {}

    let ttsOn = '{{ tts_enabled }}' === 'true';
    let ttsSpd = parseFloat('{{ tts_speed }}') || 1.2;
    let fontSize = 18, msgDelay = 500;
    let paused = false, stopped = false, running = false;

    const sharedAudio = new Audio();
    let audioUnlocked = false;

    let repeatMode = 'once';
    let repeatTotal = 3;
    let currentRound = 1;

    const chat = document.getElementById('chat-window');

    function stripParentheses(text) {
        if (!text) return '';
        return text.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
    }

    function loadSettings() {
        const sf = localStorage.getItem('smFont'); if (sf) fontSize = parseInt(sf);
        document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        document.getElementById('fontVal').textContent = fontSize + 'px';
        const sd = localStorage.getItem('smDelay'); if (sd) msgDelay = parseInt(sd);
        document.getElementById('delayVal').textContent = (msgDelay / 1000).toFixed(1) + '초';
        document.getElementById('ttsSwitch').checked = ttsOn;
        updateTTSUI();
        document.getElementById('spdSlider').value = ttsSpd;
        document.getElementById('spdVal').textContent = ttsSpd.toFixed(1) + 'x';
    }

    function toggleSettings() {
        document.getElementById('panel').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }
    function chgDelay(d) {
        msgDelay += d * 100; msgDelay = Math.max(200, Math.min(2000, msgDelay));
        localStorage.setItem('smDelay', msgDelay);
        document.getElementById('delayVal').textContent = (msgDelay / 1000).toFixed(1) + '초';
        flash('delayVal');
    }
    function chgFont(d) {
        fontSize += d; fontSize = Math.max(12, Math.min(28, fontSize));
        document.documentElement.style.setProperty('--font-size', fontSize + 'px');
        localStorage.setItem('smFont', fontSize);
        document.getElementById('fontVal').textContent = fontSize + 'px';
        flash('fontVal');
    }
    function resetAll() {
        fontSize = 18; msgDelay = 500;
        document.documentElement.style.setProperty('--font-size', '18px');
        localStorage.setItem('smFont', '18'); localStorage.setItem('smDelay', '500');
        document.getElementById('fontVal').textContent = '18px';
        document.getElementById('delayVal').textContent = '0.5초';
        flash('fontVal'); flash('delayVal');
    }
    function flash(id) {
        const el = document.getElementById(id); el.style.color = '#2a8a00';
        setTimeout(() => el.style.color = '#2a2a2a', 300);
    }

    function toggleTTS() {
        ttsOn = document.getElementById('ttsSwitch').checked;
        updateTTSUI();
        if (!ttsOn) { sharedAudio.pause(); }
    }
    function updateTTSUI() {
        document.getElementById('ttsLabel').textContent = ttsOn ? 'ON' : 'OFF';
        document.getElementById('spdWrap').classList.toggle('hidden', !ttsOn);
        document.getElementById('repeatWrap').classList.toggle('hidden', !ttsOn);
        document.getElementById('delayNote').textContent = ttsOn ? '🔊 음성 완료 후 자동 진행' : '';
    }
    function updSpd(v) {
        ttsSpd = parseFloat(v);
        document.getElementById('spdVal').textContent = ttsSpd.toFixed(1) + 'x';
    }

    function unlockAudio() {
        sharedAudio.src = 'data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4Ljc2LjEwMAAAAAAAAAAAAAAA//tQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAABhgC7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7u7//////////////////////////////////////////////////////////////////8AAAAATGF2YzU4LjEzAAAAAAAAAAAAAAAAJAAAAAAAAAAAAYYoRBqSAAAAAAAAAAAAAAAAAAAA//tQZAAP8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAETEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tQZB8P8AAAaQAAAAgAAA0gAAABAAABpAAAACAAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQ==';
        sharedAudio.play().then(() => {
            sharedAudio.pause(); sharedAudio.currentTime = 0; audioUnlocked = true;
        }).catch(() => {});
    }

    function speak(text, role) {
        return new Promise(resolve => {
            if (!ttsOn || !text?.trim()) { resolve(); return; }
            const cleanText = stripParentheses(text);
            if (!cleanText) { resolve(); return; }
            const gender = roleGenders[role] || 'female';
            const url = `/tts?text=${encodeURIComponent(cleanText)}&gender=${gender}&speed=${ttsSpd}`;
            sharedAudio.pause();
            sharedAudio.onended = () => { sharedAudio.onended = null; sharedAudio.onerror = null; resolve(); };
            sharedAudio.onerror = () => { sharedAudio.onended = null; sharedAudio.onerror = null; resolve(); };
            sharedAudio.src = url;
            sharedAudio.play().catch(() => { resolve(); });
        });
    }

    function setRepeat(mode) {
        repeatMode = mode;
        document.querySelectorAll('.repeat-opt').forEach(el => el.classList.remove('active'));
        document.getElementById(mode === 'once' ? 'repOnce' : mode === 'count' ? 'repCount' : 'repInf').classList.add('active');
        document.getElementById('repCountWrap').classList.toggle('hidden', mode !== 'count');
        updateRepeatStatus();
    }
    function updateRepeatCount() {
        repeatTotal = parseInt(document.getElementById('repCountInput').value) || 3;
        if (repeatTotal < 1) repeatTotal = 1;
        updateRepeatStatus();
    }
    function updateRepeatStatus() {
        const status = document.getElementById('repeatStatus');
        if (repeatMode === 'once') status.textContent = '1회 재생';
        else if (repeatMode === 'count') status.textContent = `${repeatTotal}회 반복 (현재: ${currentRound}회차)`;
        else status.textContent = `무한 반복 (현재: ${currentRound}회차)`;
    }

    // ★ 말풍선 넘버링 - 검은 뱃지
    function addMsg(text, type, role, idx) {
        const div = document.createElement('div');
        div.className = `msg ${type} animate`;
        if (roleColors[role] && type !== 'action') div.style.background = roleColors[role];
        const numBadge = idx ? `<span class="num">${idx}</span>` : '';
        div.innerHTML = `<span class="role-label">${numBadge}${role}</span>${text}`;
        chat.appendChild(div);
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        return div;
    }

    function addRoundDivider(round) {
        const div = document.createElement('div');
        div.className = 'round-divider';
        div.textContent = `🔁 ${round}회차 시작`;
        chat.appendChild(div);
        chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
    }

    function waitPause() {
        return new Promise(resolve => {
            if (!paused) { resolve(); return; }
            const check = setInterval(() => {
                if (!paused || stopped) { clearInterval(check); resolve(); }
            }, 100);
        });
    }

    function togglePause() {
        paused = !paused;
        const btn = document.getElementById('pauseBtn');
        if (paused) {
            btn.textContent = '▶ 재개'; btn.className = 'b-resume';
            sharedAudio.pause();
        } else {
            btn.textContent = '⏸ 일시정지'; btn.className = 'b-pause';
            if (ttsOn && sharedAudio.src) sharedAudio.play().catch(()=>{});
        }
    }

    function stopAndGoHome() {
        stopped = true;
        sharedAudio.pause();
        location.href = '/';
    }

    async function playOnce() {
        for (let i = 0; i < scriptData.length; i++) {
            if (stopped) return false;
            await waitPause();
            if (stopped) return false;
            const item = scriptData[i];
            const isMyRole = myRoles.some(r => item.role.includes(r));
            const type = item.role === "(지문)" ? "action" : isMyRole ? "user" : "bot";
            const el = addMsg(item.text, type, item.role, item.idx);
            if (ttsOn && item.role !== "(지문)" && item.text.trim()) {
                el.classList.add('speaking');
                await speak(item.text, item.role);
                el.classList.remove('speaking');
                await new Promise(r => setTimeout(r, 150));
            } else if (ttsOn) {
                await new Promise(r => setTimeout(r, msgDelay));
            }
            // ttsOn이 false면 딜레이 없이 즉시 다음으로
        }
        return true;
    }

    async function run() {
        if (running) return;
        running = true;
        currentRound = 1;
        updateRepeatStatus();
        while (!stopped) {
            if (currentRound > 1) {
                addRoundDivider(currentRound);
                await new Promise(r => setTimeout(r, 1000));
            }
            const completed = await playOnce();
            if (!completed || stopped) break;
            if (repeatMode === 'once') {
                break;
            } else if (repeatMode === 'count') {
                if (currentRound >= repeatTotal) break;
                currentRound++; updateRepeatStatus();
            } else {
                currentRound++; updateRepeatStatus();
            }
        }
        if (!stopped) {
            const endDiv = document.createElement('div');
            endDiv.className = 'msg action animate';
            endDiv.innerHTML = repeatMode === 'once' ? '🎉 전체 보기 완료!' : `🎉 ${currentRound}회 반복 완료!`;
            chat.appendChild(endDiv);
            chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        }
        running = false;
    }

    loadSettings();

    // 맨위로 버튼 - 스크롤 내려가면 표시
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    chat.addEventListener('scroll', () => {
        scrollTopBtn.classList.toggle('visible', chat.scrollTop > 200);
    });

    if (ttsOn) {
        const overlay = document.getElementById('startOverlay');
        overlay.style.display = 'flex';
        document.getElementById('startBtn').addEventListener('click', function() {
            unlockAudio();
            overlay.style.display = 'none';
            run();
        });
    } else {
        run();
    }

    if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
        window.location.href = '/';
    }
</script>
</body>
</html>
