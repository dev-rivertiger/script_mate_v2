<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Script Mate - 연습 중</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --font-size: 18px;
            --message-delay: 500;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #bacee0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        .top-bar { 
            background: white; 
            padding: 12px 16px; 
            border-bottom: 2px solid #e0e0e0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0;
            z-index: 100;
            gap: 8px;
        }
        
        .top-bar button { 
            background: #222; color: white; border: none; 
            padding: 10px 16px; border-radius: 8px; 
            cursor: pointer; font-size: 14px; font-weight: 600;
        }
        
        .top-bar .filename {
            font-weight: bold; font-size: 14px; flex: 1;
            text-align: center; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; padding: 0 8px;
        }
        
        /* 설정 패널 */
        .settings-btn { background: #666 !important; padding: 10px 12px !important; font-size: 18px !important; }
        .settings-panel {
            position: fixed; top: 0; right: -100%; width: 300px; height: 100%;
            background: white; box-shadow: -4px 0 12px rgba(0,0,0,0.2);
            z-index: 200; transition: right 0.3s ease; overflow-y: auto;
        }
        .settings-panel.open { right: 0; }
        .settings-header { padding: 20px; background: #f8f9fa; border-bottom: 2px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
        .settings-content { padding: 24px; }
        .setting-item { margin-bottom: 28px; }
        .setting-label { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: block; }
        .setting-value { font-size: 20px; font-weight: bold; color: #007bff; display: block; }
        .setting-controls { display: flex; gap: 8px; }
        .setting-btn { flex: 1; padding: 12px; background: #f0f0f0; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .settings-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 199; display: none; }
        .settings-overlay.show { display: block; }

        /* 채팅창 최적화 */
        #chat-window { 
            flex: 1; 
            overflow-y: auto; 
            padding: 16px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            /* 모바일 부드러운 스크롤 */
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            overscroll-behavior-y: contain;
        }
        
        .msg { 
            max-width: 85%; padding: 14px 16px; border-radius: 18px; 
            line-height: 1.6; font-size: var(--font-size, 16px);
            word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            opacity: 0; transform: translateY(10px);
        }
        
        .msg.animate { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
        
        .bot { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }
        .user { align-self: flex-end; background: #fee500; border-bottom-right-radius: 4px; }
        .action { align-self: center; background: rgba(0,0,0,0.08); border-radius: 20px; padding: 8px 16px; text-align: center; }
        
        .role-label { font-size: 0.8em; font-weight: 700; color: #555; display: block; margin-bottom: 4px; }
        .answer-box { margin-top: 10px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 10px; }
        .correct { color: #00aa00; font-weight: bold; }
        .wrong { color: #dd0000; }

        /* 입력 영역 */
        .input-area { 
            background: white; padding: 12px; display: flex; gap: 8px; 
            border-top: 2px solid #e0e0e0; align-items: flex-end; flex-shrink: 0;
        }
        .input-wrapper { flex: 1; position: relative; }
        textarea { 
            width: 100%; min-height: 44px; max-height: 100px; font-size: 16px; 
            padding: 12px 35px 12px 12px; border-radius: 12px; border: 1px solid #ddd; 
            resize: none; outline: none;
        }
        .clear-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; background: #ccc; border: none; color: white; display: none; align-items: center; justify-content: center; font-size: 12px; }
        .clear-btn.show { display: flex; }
        .btn-container { display: flex; flex-direction: column; gap: 6px; }
        .send-btn, .next-btn { padding: 0 20px; height: 44px; border-radius: 12px; border: none; font-weight: bold; }
        .send-btn { background: #fee500; }
        .next-btn { background: #007bff; color: white; }
    </style>
</head>
<body>

<div class="top-bar">
    <button onclick="location.href='/'">🏠</button>
    <div class="filename">{{ filename }}</div>
    <button class="settings-btn" onclick="toggleSettings()">☰</button>
</div>

<div class="settings-overlay" id="settingsOverlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
        <h3>⚙️ 설정</h3>
        <button onclick="toggleSettings()" style="background:none; color:#666; font-size:20px;">✕</button>
    </div>
    <div class="settings-content">
        <div class="setting-item">
            <label class="setting-label">대사 속도</label>
            <span class="setting-value" id="speedValue">0.5초</span>
            <div class="setting-controls">
                <button class="setting-btn" onclick="changeSpeed(-1)">빠르게 +</button>
                <button class="setting-btn" onclick="changeSpeed(1)">느리게 -</button>
            </div>
        </div>
        <div class="setting-item">
            <label class="setting-label">폰트 크기</label>
            <span class="setting-value" id="fontValue">18px</span>
            <div class="setting-controls">
                <button class="setting-btn" onclick="changeFontSize(-2)">A-</button>
                <button class="setting-btn" onclick="changeFontSize(2)">A+</button>
            </div>
        </div>
        <button class="setting-btn" onclick="resetSettings()" style="width: 100%; background: #fee500; margin-top: 20px;">🔄 초기화</button>
    </div>
</div>

<div id="chat-window"></div>

<div class="input-area">
    <div class="input-wrapper">
        <textarea id="userInput" placeholder="대사 입력"></textarea>
        <button class="clear-btn" id="clearBtn" onclick="clearInput()">✕</button>
    </div>
    <div class="btn-container">
        <button class="send-btn" onclick="handleInput()">전송</button>
        <button class="next-btn" onclick="skipToNext()">다음</button>
    </div>
</div>

<script>
    const script = JSON.parse('{{ script | tojson | safe }}');
    const myRoles = JSON.parse('{{ my_roles | tojson | safe }}');
    
    let currentIdx = 0;
    let myTurnIdx = null;
    let isComposing = false;
    let currentFontSize = 18;
    let messageDelay = 500;

    const inputEl = document.getElementById('userInput');
    const chatWindow = document.getElementById('chat-window');
    const clearBtn = document.getElementById('clearBtn');

    // 설정 관리
    function loadSettings() {
        currentFontSize = parseInt(localStorage.getItem('scriptMateFontSize')) || 18;
        messageDelay = parseInt(localStorage.getItem('scriptMateDelay')) || 500;
        applySettings();
    }

    function applySettings() {
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        document.getElementById('fontValue').textContent = currentFontSize + 'px';
        document.getElementById('speedValue').textContent = (messageDelay / 1000).toFixed(1) + '초';
    }

    function toggleSettings() {
        document.getElementById('settingsPanel').classList.toggle('open');
        document.getElementById('settingsOverlay').classList.toggle('show');
    }

    function changeSpeed(delta) {
        messageDelay = Math.min(Math.max(messageDelay + delta * 100, 200), 2000);
        localStorage.setItem('scriptMateDelay', messageDelay);
        applySettings();
    }

    function changeFontSize(delta) {
        currentFontSize = Math.min(Math.max(currentFontSize + delta, 12), 28);
        localStorage.setItem('scriptMateFontSize', currentFontSize);
        applySettings();
    }

    function resetSettings() {
        currentFontSize = 18; messageDelay = 500;
        localStorage.clear();
        applySettings();
    }

    // 메시지 추가 및 스크롤 최적화
    function addMessage(text, type, role, idx, extra="") {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = `<span class="role-label">[${idx}] ${role}</span>${text}${extra}`;
        chatWindow.appendChild(div);
        
        // 브라우저 렌더링 주기와 동기화하여 스크롤
        requestAnimationFrame(() => {
            setTimeout(() => {
                div.classList.add('animate');
                chatWindow.scrollTo({
                    top: chatWindow.scrollHeight,
                    behavior: 'smooth'
                });
            }, 50);
        });
    }

    async function showNext() {
        while (currentIdx < script.length) {
            const item = script[currentIdx];
            if (myRoles.some(role => item.role.includes(role))) {
                myTurnIdx = currentIdx;
                return;
            }
            const type = item.role === "(지문)" ? "action" : "bot";
            addMessage(item.text, type, item.role, item.idx);
            currentIdx++;
            await new Promise(r => setTimeout(r, messageDelay));
        }
    }

    function handleInput() {
        const rawVal = inputEl.value.trim();
        if (/^\d+$/.test(rawVal)) { jumpToIndex(parseInt(rawVal)); return; }
        if (myTurnIdx === null) { inputEl.value = ""; return; }

        const target = script[myTurnIdx];
        if (!rawVal) {
            addMessage("(힌트 확인)", 'user', target.role, target.idx, `<div class="answer-box wrong">💡 정답: ${target.text}</div>`);
            return;
        }

        const isCorrect = normalize(rawVal) === normalize(target.text) || getSimilarity(normalize(rawVal), normalize(target.text)) >= 0.7;
        const resultBox = isCorrect ? `<div class="answer-box correct">✓ 정답!</div>` : `<div class="answer-box wrong">✗ 오답! 정답: ${target.text}</div>`;
        
        addMessage(rawVal, 'user', target.role, target.idx, resultBox);
        if (isCorrect) { inputEl.value = ''; currentIdx = myTurnIdx + 1; myTurnIdx = null; setTimeout(showNext, 300); }
    }

    function jumpToIndex(num) {
        const found = script.findIndex(item => parseInt(item.idx) === num);
        if (found !== -1) { chatWindow.innerHTML = ''; currentIdx = found; myTurnIdx = null; showNext(); }
    }

    function skipToNext() {
        if (myTurnIdx !== null) {
            const target = script[myTurnIdx];
            addMessage("(건너뛰기)", 'user', target.role, target.idx, `<div class="answer-box">⏭️ ${target.text}</div>`);
            currentIdx = myTurnIdx + 1; myTurnIdx = null; setTimeout(showNext, 300);
        } else { showNext(); }
    }

    function normalize(text) { return text.replace(/\([^)]*\)/g, '').replace(/[^a-zA-Z0-9가-힣]/g, '').toLowerCase().trim(); }
    function getSimilarity(s1, s2) {
        let longer = s1.length > s2.length ? s1 : s2;
        let shorter = s1.length > s2.length ? s2 : s1;
        if (longer.length === 0) return 1.0;
        return (longer.length - editDistance(longer, shorter)) / longer.length;
    }
    function editDistance(s1, s2) {
        let costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i === 0) costs[j] = j;
                else if (j > 0) {
                    let newValue = costs[j - 1];
                    if (s1.charAt(i - 1) !== s2.charAt(j - 1)) newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                    costs[j - 1] = lastValue; lastValue = newValue;
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    function clearInput() { inputEl.value = ''; clearBtn.classList.remove('show'); inputEl.focus(); }
    inputEl.addEventListener('input', () => clearBtn.classList.toggle('show', !!inputEl.value.trim()));
    inputEl.addEventListener('compositionstart', () => isComposing = true);
    inputEl.addEventListener('compositionend', () => isComposing = false);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !isComposing) { e.preventDefault(); handleInput(); } });

    loadSettings();
    showNext();
</script>
</body>
</html>
