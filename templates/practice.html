<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SCAT - 연습 중</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --font-size: 18px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #e8e0d0;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            overflow: hidden; position: fixed; width: 100%;
        }

        /* 노트 배경선 */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(160,170,180,0.12) 39px, rgba(160,170,180,0.12) 40px);
            pointer-events: none; z-index: 0;
        }

        /* 탑바 */
        .top-bar {
            background: #fffef8;
            padding: 10px 14px;
            border-bottom: 2.5px solid #2a2a2a;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0; z-index: 100; gap: 8px;
            box-shadow: 0 2px 0 #2a2a2a;
        }
        .top-bar button {
            background: #2a2a2a; color: #fff9c2;
            border: none; padding: 9px 14px;
            border-radius: 3px; cursor: pointer;
            font-family: 'Caveat', cursive;
            font-size: 16px; font-weight: 700;
            box-shadow: 2px 2px 0 #555;
            transition: all 0.12s;
        }
        .top-bar button:active { transform: translate(2px,2px); box-shadow: 0 0 0 #555; }
        .top-bar .filename {
            font-family: 'Caveat', cursive;
            font-weight: 700; font-size: 16px; flex: 1; text-align: center;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
            color: #2a2a2a;
        }
        .settings-btn {
            background: #555 !important;
            padding: 9px 13px !important;
            font-size: 17px !important;
        }

        /* 설정 패널 */
        .settings-panel {
            position: fixed; top: 0; right: -100%; width: 300px; height: 100%;
            background: #fffef8; box-shadow: -4px 0 0 #2a2a2a;
            z-index: 200; transition: right 0.3s ease; overflow-y: auto;
            border-left: 2.5px solid #2a2a2a;
        }
        .settings-panel.open { right: 0; }
        .sh {
            padding: 18px 20px; background: #fff9c2;
            border-bottom: 2.5px solid #2a2a2a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .sh h3 { font-family: 'Caveat', cursive; font-size: 20px; margin: 0; }
        .cb {
            background: none; border: 2px solid #2a2a2a; font-size: 20px; cursor: pointer;
            color: #2a2a2a; width: 30px; height: 30px; border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Caveat', cursive; font-weight: 700;
        }
        .sc { padding: 22px; }
        .si { margin-bottom: 22px; }
        .sl { font-family: 'Caveat', cursive; font-size: 17px; font-weight: 700; margin-bottom: 8px; display: block; color: #2a2a2a; }
        .sv { font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; color: #2a2a2a; margin-bottom: 8px; display: block; transition: color 0.3s; }
        .sctrl { display: flex; gap: 8px; }
        .sb {
            flex: 1; padding: 10px;
            background: #f0ece0; border: 2px solid #ccc; border-radius: 3px;
            font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.1s;
        }
        .sb:active { background: #ddd; transform: translate(1px,1px); }

        /* 토글 스위치 */
        .tr { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
        .ts { position: relative; width: 52px; height: 28px; flex-shrink: 0; }
        .ts input { opacity: 0; width: 0; height: 0; }
        .tsl { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: #ccc; border-radius: 28px; cursor: pointer; transition: 0.3s;
            border: 2px solid #999; }
        .tsl::before { content: ''; position: absolute; height: 20px; width: 20px;
            left: 2px; bottom: 2px; background: white; border-radius: 50%; transition: 0.3s; }
        .ts input:checked + .tsl { background: #2a2a2a; border-color: #2a2a2a; }
        .ts input:checked + .tsl::before { transform: translateX(24px); }
        .ttsLbl { font-family: 'Caveat', cursive; font-size: 16px; font-weight: 700; }

        .sw { margin-top: 12px; }
        .sw.hd { display: none; }
        .ss { width: 100%; height: 6px; -webkit-appearance: none; appearance: none;
            background: #ddd; border-radius: 3px; outline: none; }
        .ss::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px;
            background: #2a2a2a; border-radius: 50%; cursor: pointer; }
        .srl { display: flex; justify-content: space-between; font-size: 12px; color: #999; margin-top: 4px; font-family: 'Caveat', cursive; }

        .settings-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); z-index: 199; display: none;
        }
        .settings-overlay.show { display: block; }

        /* 채팅창 */
        #chat-window {
            flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
            -webkit-overflow-scrolling: touch;
            position: relative; z-index: 1;
        }

        /* 말풍선 */
        .msg {
            max-width: 85%; padding: 12px 15px;
            border-radius: 3px;
            line-height: 1.6;
            font-size: var(--font-size); word-wrap: break-word;
            border: 2px solid #2a2a2a;
            opacity: 0; transform: translateY(10px);
        }
        .msg.animate { animation: slideIn 0.35s ease-out forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }

        /* 상대방 말풍선 - 왼쪽 */
        .bot {
            align-self: flex-start;
            background: white;
            box-shadow: 3px 3px 0 #2a2a2a;
            border-bottom-left-radius: 0;
        }
        /* 내 말풍선 - 오른쪽 */
        .user {
            align-self: flex-end;
            background: #fff9c2;
            box-shadow: -3px 3px 0 #2a2a2a;
            border-bottom-right-radius: 0;
        }
        /* 지문 */
        .action {
            align-self: center;
            background: rgba(42,42,42,0.07);
            border: 1.5px dashed #999;
            border-radius: 20px;
            font-size: calc(var(--font-size) * 0.85);
            padding: 7px 16px; max-width: 90%; text-align: center;
            box-shadow: none;
        }

        /* 넘버링 라벨 - 핵심! */
        .role-label {
            font-family: 'Caveat', cursive;
            font-size: calc(var(--font-size) * 0.72);
            font-weight: 700;
            margin-bottom: 5px;
            display: block;
            color: #555;
            border-bottom: 1.5px solid rgba(0,0,0,0.1);
            padding-bottom: 4px;
        }
        .role-label .num {
            display: inline-block;
            background: #2a2a2a;
            color: white;
            font-size: calc(var(--font-size) * 0.62);
            padding: 1px 6px;
            border-radius: 10px;
            margin-right: 4px;
            font-family: 'Caveat', cursive;
            font-weight: 700;
        }

        .answer-box {
            margin-top: 10px; font-size: calc(var(--font-size) * 0.85);
            border-top: 1.5px dashed rgba(0,0,0,0.15); padding-top: 10px; line-height: 1.5;
        }
        .correct { color: #2a8a00; font-weight: bold; }
        .wrong { color: #cc2200; }
        .msg.speaking {
            box-shadow: 0 0 0 2.5px #2a2a2a, 3px 3px 0 #2a2a2a;
            animation: pulse 0.8s ease-in-out infinite alternate, slideIn 0.35s ease-out forwards;
        }
        @keyframes pulse { from { border-color: #2a2a2a; } to { border-color: #888; } }

        /* 입력 영역 */
        .input-area {
            background: #fffef8;
            padding: 10px 12px;
            display: flex; gap: 8px;
            border-top: 2.5px solid #2a2a2a;
            align-items: flex-end; flex-shrink: 0;
            box-shadow: 0 -2px 0 #2a2a2a;
            position: relative; z-index: 1;
        }
        .iw { flex: 1; position: relative; display: flex; align-items: center; }
        textarea {
            flex: 1; width: 100%; min-height: 44px; max-height: 100px;
            font-size: 16px; padding: 11px 38px 11px 12px;
            border-radius: 3px;
            border: 2px solid #ccc;
            resize: none; outline: none; font-family: inherit;
            background: white;
            transition: border-color 0.15s;
        }
        textarea:focus { border-color: #2a2a2a; }
        .xb {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 24px; height: 24px; border-radius: 50%; background: #ccc;
            border: none; cursor: pointer; display: none; align-items: center;
            justify-content: center; color: white; font-size: 14px; line-height: 1; padding: 0;
        }
        .xb.show { display: flex; }
        .bc { display: flex; flex-direction: column; gap: 6px; }
        .sendb, .nextb {
            padding: 0 16px; height: 44px; border-radius: 3px;
            border: 2px solid #2a2a2a; cursor: pointer;
            font-family: 'Caveat', cursive; font-weight: 700; font-size: 16px;
            white-space: nowrap; transition: all 0.12s;
        }
        .sendb { background: #fff9c2; color: #2a2a2a; box-shadow: 2px 2px 0 #2a2a2a; }
        .nextb { background: #2a2a2a; color: #fff9c2; box-shadow: 2px 2px 0 #555; }
        .sendb:active, .nextb:active { transform: translate(2px,2px); box-shadow: 0 0 0; }

        @supports (-webkit-touch-callout: none) { body { height: -webkit-fill-available; } }
    </style>
</head>
<body>
<script type="application/json" id="_sd">{{ script | tojson }}</script>
<script type="application/json" id="_mr">{{ my_roles | tojson }}</script>

<div class="top-bar">
    <button onclick="location.href='/'">🏠 홈</button>
    <div class="filename">{{ filename }}</div>
    <button class="settings-btn" onclick="toggleSettings()">☰</button>
</div>

<div class="settings-overlay" id="overlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="panel">
    <div class="sh">
        <h3>⚙️ 설정</h3>
        <button class="cb" onclick="toggleSettings()">✕</button>
    </div>
    <div class="sc">
        <div class="si">
            <label class="sl">🔊 음성 지원</label>
            <div class="tr">
                <label class="ts"><input type="checkbox" id="ttsSwitch" onchange="toggleTTS()"><span class="tsl"></span></label>
                <span id="ttsLbl" class="ttsLbl">OFF</span>
            </div>
            <div class="sw hd" id="spdW">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <span style="font-family:'Caveat',cursive;font-size:15px;font-weight:600;">음성 속도</span>
                    <span style="font-family:'Caveat',cursive;font-size:18px;font-weight:700;color:#2a2a2a;" id="spdV">1.2x</span>
                </div>
                <input type="range" class="ss" id="spdS" min="0.5" max="2.0" step="0.1" value="1.2" oninput="updSpd(this.value)">
                <div class="srl"><span>느리게 0.5x</span><span>빠르게 2.0x</span></div>
            </div>
        </div>
        <div class="si">
            <label class="sl">⏱ 대사 속도</label>
            <span class="sv" id="dV">0.5초</span>
            <div class="sctrl">
                <button class="sb" onclick="chgD(-1);event.stopPropagation()">빠르게 -</button>
                <button class="sb" onclick="chgD(1);event.stopPropagation()">느리게 +</button>
            </div>
            <div style="margin-top:6px;font-family:'Caveat',cursive;font-size:13px;color:#888;">0.2초 ~ 2.0초</div>
            <div style="margin-top:4px;font-family:'Caveat',cursive;font-size:13px;color:#999;" id="dN"></div>
        </div>
        <div class="si">
            <label class="sl">🔤 폰트 크기</label>
            <span class="sv" id="fV">18px</span>
            <div class="sctrl">
                <button class="sb" onclick="chgF(-2);event.stopPropagation()">A−</button>
                <button class="sb" onclick="chgF(2);event.stopPropagation()">A+</button>
            </div>
            <div style="margin-top:6px;font-family:'Caveat',cursive;font-size:13px;color:#888;">12px ~ 28px</div>
        </div>
        <button class="sb" onclick="resetA();event.stopPropagation()" style="width:100%;background:#fff9c2;border-color:#2a2a2a;margin-top:16px;">🔄 기본값 초기화</button>
    </div>
</div>

<div id="chat-window"></div>

<div class="input-area">
    <div class="iw">
        <textarea id="inp" placeholder="대사 입력 (숫자: 해당 번호로 이동)"></textarea>
        <button class="xb" id="xBtn" onclick="clr()">✕</button>
    </div>
    <div class="bc">
        <button class="sendb" onclick="handleInput()">전송</button>
        <button class="nextb" onclick="skip()">다음</button>
    </div>
</div>

<script>
    let sd=[], mr=[], rc={}, rg={};
    try{sd=JSON.parse(document.getElementById("_sd").textContent);}catch(e){console.error("script parse error",e);}
    try{mr=JSON.parse(document.getElementById("_mr").textContent);}catch(e){}
    try{rc=JSON.parse('{{ colors | safe }}');}catch(e){}
    try{rg=JSON.parse('{{ genders | safe }}');}catch(e){}

    let ttsOn=('{{tts_enabled}}').trim().toLowerCase()==='true', ttsSpd=parseFloat('{{tts_speed}}')||1.2;
    console.log('🔊 [practice] tts_enabled raw:', '{{tts_enabled}}', '→ ttsOn:', ttsOn, '/ ttsSpd:', ttsSpd);
    let ci=0, mti=null, comp=false, fs=18, dl=500, busy=false;
    const sharedAudio = new Audio();
    const inp=document.getElementById('inp'), chat=document.getElementById('chat-window'), xBtn=document.getElementById('xBtn');

    function stripParen(t){ return t?t.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim():''; }

    function speak(text,role){
        return new Promise(res=>{
            if(!ttsOn||!text?.trim()){res();return;}
            const clean=stripParen(text);
            if(!clean){res();return;}
            const g=rg[role]||'female';
            sharedAudio.pause();
            sharedAudio.onended=()=>{sharedAudio.onended=null;sharedAudio.onerror=null;res();};
            sharedAudio.onerror=()=>{sharedAudio.onended=null;sharedAudio.onerror=null;res();};
            sharedAudio.src=`/tts?text=${encodeURIComponent(clean)}&gender=${g}&speed=${ttsSpd}`;
            sharedAudio.play().catch(()=>{res();});
        });
    }
    function toggleTTS(){
        ttsOn=document.getElementById('ttsSwitch').checked; updUI();
        if(!ttsOn) sharedAudio.pause();
    }
    function updUI(){
        document.getElementById('ttsLbl').textContent=ttsOn?'ON':'OFF';
        document.getElementById('spdW').classList.toggle('hd',!ttsOn);
        document.getElementById('dN').textContent=ttsOn?'🔊 음성 완료 후 자동 진행':'';
    }
    function updSpd(v){ttsSpd=parseFloat(v);document.getElementById('spdV').textContent=ttsSpd.toFixed(1)+'x';}

    function loadS(){
        const sf=localStorage.getItem('smF');if(sf)fs=parseInt(sf);
        document.documentElement.style.setProperty('--font-size',fs+'px');
        document.getElementById('fV').textContent=fs+'px';
        const sd2=localStorage.getItem('smD');if(sd2)dl=parseInt(sd2);
        document.getElementById('dV').textContent=(dl/1000).toFixed(1)+'초';
        document.getElementById('ttsSwitch').checked=ttsOn;updUI();
        document.getElementById('spdS').value=ttsSpd;
        document.getElementById('spdV').textContent=ttsSpd.toFixed(1)+'x';
    }
    function toggleSettings(){
        document.getElementById('panel').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }
    function chgD(d){dl+=d*100;dl=Math.max(200,Math.min(2000,dl));localStorage.setItem('smD',dl);
        document.getElementById('dV').textContent=(dl/1000).toFixed(1)+'초';fl('dV');}
    function chgF(d){fs+=d;fs=Math.max(12,Math.min(28,fs));
        document.documentElement.style.setProperty('--font-size',fs+'px');
        localStorage.setItem('smF',fs);document.getElementById('fV').textContent=fs+'px';fl('fV');}
    function resetA(){fs=18;dl=500;document.documentElement.style.setProperty('--font-size','18px');
        localStorage.setItem('smF','18');localStorage.setItem('smD','500');
        document.getElementById('fV').textContent='18px';document.getElementById('dV').textContent='0.5초';fl('fV');fl('dV');}
    function fl(id){const e=document.getElementById(id);e.style.color='#2a8a00';setTimeout(()=>e.style.color='#2a2a2a',300);}

    loadS();

    inp.addEventListener('compositionstart',()=>comp=true);
    inp.addEventListener('compositionend',()=>comp=false);
    inp.addEventListener('input',()=>xBtn.classList.toggle('show',!!inp.value.trim()));
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!comp){e.preventDefault();handleInput();}});
    function clr(){inp.value='';xBtn.classList.remove('show');inp.focus();}
    function norm(t){return t?t.replace(/\([^)]*\)/g,'').replace(/[^a-zA-Z0-9가-힣]/g,'').toLowerCase().trim():'';}

    // ★ 말풍선 넘버링 - [번호]를 검은 뱃지로 표시
    function addMsg(text,type,role,idx,extra=''){
        const div=document.createElement('div');div.className=`msg ${type}`;
        if(rc[role]&&type!=='action')div.style.background=rc[role];
        // 넘버링 표시: action 타입도 번호 포함
        const numBadge = idx ? `<span class="num">${idx}</span>` : '';
        div.innerHTML=`<span class="role-label">${numBadge}${role}</span>${text}${extra}`;
        chat.appendChild(div);
        setTimeout(()=>div.classList.add('animate'),10);
        setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}),100);
        return div;
    }

    async function showNext(){
        if(busy)return;busy=true;
        try{
            while(ci<sd.length){
                const it=sd[ci];
                if(mr.some(r=>it.role.includes(r))){mti=ci;inp.focus();busy=false;return;}
                const type=it.role==="(지문)"?"action":"bot";
                const el=addMsg(it.text,type,it.role,it.idx);ci++;
                if(ttsOn&&it.role!=="(지문)"&&it.text.trim()){
                    el.classList.add('speaking');await speak(it.text,it.role);
                    el.classList.remove('speaking');await new Promise(r=>setTimeout(r,150));
                }else{await new Promise(r=>setTimeout(r,dl));}
            }
            if(ci>=sd.length){
                const e=document.createElement('div');e.className='msg action animate';
                e.innerHTML='🎉 연습 완료!';chat.appendChild(e);
                chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});mti=null;
            }
        }catch(e){console.error(e);}
        busy=false;
    }

    function handleInput(){
        const v=inp.value.trim();
        if(/^\d+$/.test(v)){jump(parseInt(v));inp.value='';xBtn.classList.remove('show');return;}
        if(mti===null){inp.value='';xBtn.classList.remove('show');return;}
        const t=sd[mti];
        if(!v){addMsg("(내 대사 확인)",'user',t.role,t.idx,
            `<div class="answer-box wrong">💡 힌트: <br><strong>${t.text}</strong></div>`);return;}
        const sim=getSim(norm(v),norm(t.text)),ok=sim>=0.7;
        const rb=ok?`<div class="answer-box correct">✓ 정답!</div>`:
            `<div class="answer-box wrong">✗ 틀림 (${(sim*100).toFixed(0)}%)<br><strong>정답: ${t.text}</strong></div>`;
        addMsg(v,'user',t.role,t.idx,rb);
        if(ok){inp.value='';xBtn.classList.remove('show');ci=mti+1;mti=null;setTimeout(showNext,300);}
    }
    function skip(){
        if(mti!==null){const t=sd[mti];addMsg("(건너뛰기)",'user',t.role,t.idx,
            `<div class="answer-box">⏭️<br><strong>${t.text}</strong></div>`);
            inp.value='';xBtn.classList.remove('show');ci=mti+1;mti=null;setTimeout(showNext,300);
        }else showNext();
    }
    function jump(n){
        const fi=sd.findIndex(i=>parseInt(i.idx)===n);
        if(fi===-1){alert(`${n}번 없음`);return;}
        sharedAudio.pause();
        chat.innerHTML='';ci=fi;mti=null;busy=false;
        const d=document.createElement('div');d.className='msg action animate';
        d.innerHTML=`🚩 [${n}]번으로 이동`;chat.appendChild(d);showNext();
    }
    function getSim(a,b){if(a===b)return 1;const l=a.length>b.length?a:b,s=a.length>b.length?b:a;
        if(!l.length)return 1;return(l.length-ed(l,s))/l.length;}
    function ed(a,b){let c=[];for(let i=0;i<=a.length;i++){let lv=i;for(let j=0;j<=b.length;j++){
        if(i===0)c[j]=j;else if(j>0){let nv=c[j-1];if(a[i-1]!==b[j-1])nv=Math.min(nv,lv,c[j])+1;
        c[j-1]=lv;lv=nv;}}if(i>0)c[b.length]=lv;}return c[b.length];}

    showNext(); inp.focus();
    if(performance.navigation.type===performance.navigation.TYPE_RELOAD)window.location.href='/';
</script>
</body>
</html>
