<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Script Mate</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#fff8f3;--card:#fff;--pop:#ff6b6b;--pop2:#ff8787;
            --mint:#20c997;--mint-bg:#e6fcf5;--lemon:#ffd43b;--lemon-bg:#fff9db;
            --text:#2b2b2b;--text-mid:#777;--border:#f0e9e3;
        }
        body{
            font-family:'Noto Sans KR','Jua',sans-serif;
            background:var(--bg);min-height:100vh;display:flex;
            justify-content:center;align-items:center;padding:24px;
            position:relative;overflow:hidden;
        }
        body::before,body::after{content:'';position:fixed;border-radius:50%;pointer-events:none;}
        body::before{top:-40px;right:-30px;width:200px;height:200px;background:var(--lemon-bg);opacity:.7;}
        body::after{bottom:-50px;left:-30px;width:180px;height:180px;background:var(--mint-bg);opacity:.6;}
        .card{
            background:var(--card);padding:48px 36px 40px;border-radius:28px;
            text-align:center;box-shadow:0 8px 32px rgba(255,107,107,.08),0 2px 8px rgba(0,0,0,.04);
            max-width:380px;width:100%;position:relative;z-index:1;
            border:2px solid var(--border);
        }
        .icon{font-size:64px;display:block;margin-bottom:6px;
            animation:bounce 2s ease-in-out infinite;}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        h1{font-family:'Jua',sans-serif;font-size:32px;color:var(--pop);
            margin-bottom:4px;letter-spacing:-0.5px;}
        .sub{font-size:14px;color:var(--text-mid);margin-bottom:36px;}
        .btn{
            display:block;width:100%;padding:16px 20px;font-size:16px;font-weight:700;
            border-radius:16px;border:none;cursor:pointer;transition:all .15s;
            font-family:'Noto Sans KR',sans-serif;margin-bottom:10px;letter-spacing:-.2px;
        }
        .btn:active{transform:scale(.96)}
        .btn-a{background:var(--pop);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.25);}
        .btn-a:hover{background:var(--pop2);}
        .btn-b{background:var(--mint-bg);color:var(--mint);border:2px solid #b2f2d9;}
        .btn-b:hover{background:#d3f9ee;}
        .footer{margin-top:24px;font-size:11px;color:#bbb;}
        .sparkle{position:absolute;font-size:20px;opacity:.4;pointer-events:none;}
        .sp1{top:14px;left:20px;animation:spin 4s linear infinite;}
        .sp2{top:18px;right:24px;animation:spin 3s linear infinite reverse;}
        .sp3{bottom:16px;left:50%;animation:spin 5s linear infinite;}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        @media(max-width:480px){.card{padding:40px 28px 36px}h1{font-size:28px}}
    </style>
</head>
<body>
<div class="card">
    <span class="sparkle sp1">✦</span>
    <span class="sparkle sp2">✧</span>
    <span class="sparkle sp3">✦</span>
    <span class="icon">💬</span>
    <h1>Script Mate</h1>
    <p class="sub">대본 리딩 연습을 시작해볼까요? ✨</p>
    <button class="btn btn-a" onclick="location.href='/select?mode=view'">📖 전체 읽기</button>
    <button class="btn btn-b" onclick="location.href='/select?mode=practice'">✍️ 연습 모드</button>
    <p class="footer">연극 · 뮤지컬 · 드라마 대본 연습</p>
</div>
</body>
</html>
