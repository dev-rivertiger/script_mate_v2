<!DOCTYPE html>
<html>
<head>
    <title>Script Mate</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #bacee0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            background: #fee500;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🎭 Script Mate</h1>
    <p>리딩 연습을 시작하세요</p>
    <button onclick="location.href='/select'">연습 시작</button>
</div>

</body>
</html>
