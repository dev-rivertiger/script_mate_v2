<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Script Mate</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #bacee0 0%, #a8bfd4 100%);
            padding: 20px;
        }

        .box {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 16px;
            color: #222;
        }

        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 32px;
        }

        button {
            padding: 16px 40px;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            background: #fee500;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            width: 100%;
        }

        button:hover {
            background: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(254, 229, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        /* 모바일 최적화 */
        @media (max-width: 600px) {
            .box { padding: 40px 30px; }
            h1 { font-size: 28px; }
            p { font-size: 15px; }
            button { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🎭 Script Mate</h1>
    <p>대본 리딩 연습을 시작하세요</p>
    <button onclick="location.href='/select'">연습 시작</button>
</div>

</body>
</html>
